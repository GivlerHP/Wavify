buildscript {
    repositories {
        mavenCentral()
        maven { name = "forge"; url = "https://maven.minecraftforge.net/" }
        maven { name = "sonatype"; url = "https://oss.sonatype.org/content/repositories/snapshots/" }
    }
    dependencies {
        classpath ('com.anatawa12.forge:ForgeGradle:1.2-1.1.+') { changing = true }
    }
}

apply plugin: 'forge'
apply plugin: 'idea'

project.sourceCompatibility = '1.8'
project.targetCompatibility = '1.8'

version = "1.2.1-backport.3"
group = "net.superkat.wavify"
archivesBaseName = "Wavify"

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
    replace "@VERSION@", project.version
}

repositories {
    mavenCentral()
    maven { name = "chickenbones"; url = "https://chickenbones.net/maven/" }
    flatDir { dirs 'libs' }
}

dependencies {
//    compile name: "MF2-dev"
//    implementation name: 'AriamisBOB'
}

jar {
    from sourceSets.main.output
}

task deobfJar(type: Jar) {
    from sourceSets.main.output
    classifier = 'deobf'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:unchecked'
}

idea {
    module {
        inheritOutputDirs = true
    }
}

tasks.build.dependsOn('deobfJar')

processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') {
        expand(version: project.version, mcversion: project.minecraft.version)
    }
}

jar { from('LICENSE'); from('CREDITS') }

// Pure snapshot/river/animation regression checks; do not launch a Minecraft world.
task verifyBackport(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.superkat.wavify.renderer.BackportChecks'
}
check.dependsOn verifyBackport

// Optional native check on a workstation with LWJGL natives; never opens a visible window.
task verifyRenderState(type: JavaExec, dependsOn: testClasses) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.superkat.wavify.renderer.RenderStateChecks'
    systemProperty 'org.lwjgl.librarypath', file('build/test-natives').absolutePath
    systemProperty 'java.library.path', file('build/test-natives').absolutePath
}
